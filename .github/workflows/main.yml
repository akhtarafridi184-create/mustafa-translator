name: Build Mustafa Translator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;35.0.0 ndk;26.1.10909125"

      - name: Install PySide6 tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.8.2.1

      - name: Prepare main.py
        run: |
          cp "real translator app.py" main.py

      - name: Install deployment dependencies
        run: |
          python -m pip install buildozer==1.5.0
          python -m pip install cython

      - name: Download Android PySide6 wheels
        run: |
          qtpip download PySide6==6.8.2.1 --android --arch aarch64
          qtpip download Shiboken6==6.8.2.1 --android --arch aarch64

      - name: Build APK
        run: |
          pyside6-android-deploy \
            --name "Mustafa Translator" \
            --wheel-pyside=$(find . -name "PySide6-6.8.2.1-*-android_aarch64.whl" | head -1) \
            --wheel-shiboken=$(find . -name "shiboken6-6.8.2.1-*-android_aarch64.whl" | head -1) \
            --ndk-path=$ANDROID_NDK_ROOT \
            --sdk-path=$ANDROID_SDK_ROOT \
            --force

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mustafa-Translator-APK
          path: |
            **/*.apk
